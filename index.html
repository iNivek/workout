<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Recomp Plan"/>

<title>7-Day Recomp Workout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{background:#070d14;overflow:hidden}
html{height:100%;height:-webkit-fill-available}
body{font-family:'Courier New',Courier,monospace;color:#94a3b8;height:100%;height:-webkit-fill-available}
button{-webkit-appearance:none;font-family:'Courier New',Courier,monospace;cursor:pointer;border:none}
::-webkit-scrollbar{display:none}
#root{display:flex;flex-direction:column;height:100svh;height:-webkit-fill-available;
  max-width:480px;margin:0 auto;background:#070d14;overflow:hidden;position:relative}

/* HEADER */
.hdr{background:linear-gradient(160deg,#0c1929 0%,#100b1e 100%);border-bottom:1px solid #0d1e2e;
  flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top,14px));
  padding-left:16px;padding-right:16px;padding-bottom:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-sub{font-size:8px;color:#1e3040;letter-spacing:3px;margin-bottom:2px}
.hdr-ttl{font-size:18px;font-weight:700;color:#e2e8f0;letter-spacing:1px}
.hdr-pct{font-size:22px;font-weight:700;text-align:right}
.hdr-plbl{font-size:8px;color:#1e3040;letter-spacing:1px}
.pbar{height:2px;background:#0d1e2e;overflow:hidden}
.pfill{height:100%;transition:width .5s ease}
.dtabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dtab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 14px;background:transparent;border-bottom:2px solid transparent;
  min-width:58px;transition:all .2s}
.dtab.on{border-bottom-color:var(--c)}
.dtab .em{font-size:19px;line-height:1}
.dtab .lb{font-size:10px;font-weight:700;letter-spacing:1px;color:#4b5563;transition:color .2s}
.dtab.on .lb{color:var(--c)}
.dots{display:flex;gap:2px;margin-top:1px}
.dot{width:4px;height:4px;border-radius:50%;background:#1e2d3e;transition:background .3s}
.dot.on{background:var(--c)}

/* DAY HEADER */
.dhdr{padding:12px 16px 10px;border-bottom:1px solid #0d1e2e;flex-shrink:0}
.dhdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dtp{font-size:8px;letter-spacing:3px;margin-bottom:3px}
.dnm{font-size:17px;font-weight:700;color:#e2e8f0;line-height:1.2}
.dsub{font-size:11px;color:#374151;margin-top:1px}
.dctr{border-radius:20px;padding:4px 12px;flex-shrink:0;font-size:11px;font-weight:700}
.dgoal{font-size:10px;color:#1e3a52;margin-top:7px;line-height:1.5;border-left:2px solid;padding-left:8px}

/* BODY */
.body{flex:1;display:flex;overflow:hidden;min-height:0}
.exlist{overflow-y:auto;-webkit-overflow-scrolling:touch;transition:width .25s ease;flex-shrink:0}
.exlist.full{width:100%}
.exlist.split{width:38%;border-right:1px solid #0d1e2e}
.exrow{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#0b1520;
  border-left:3px solid transparent;border-bottom:1px solid #0d1c2a;cursor:pointer;
  transition:background .15s,border-color .15s;user-select:none}
.exrow.sel{border-left-color:var(--c)}
.exdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#1e3040}
.exdot.done{background:#22c55e}
.exnm{font-size:12px;font-weight:600;line-height:1.35;color:#64748b;margin-bottom:3px;transition:color .15s}
.exrow.sel .exnm{color:#f1f5f9}
.exmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.extlbl{font-size:8px;letter-spacing:1.5px}
.exsets{font-size:10px;color:#374151}
.donebtn{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:transparent;
  border:2px solid #1e3040;color:#1e3040;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.donebtn.chk{background:#15803d;border-color:#22c55e;color:#fff}

/* DETAIL */
.detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#08111a;min-width:0}
.detail-inner{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.backbtn{background:transparent;color:#374151;padding:4px 0;font-size:11px;letter-spacing:1px;text-align:left}
.detype{font-size:8px;letter-spacing:2px;margin-bottom:3px}
.denm{font-size:14px;font-weight:700;color:#e2e8f0;line-height:1.35}
.statsrow{display:flex;gap:6px;flex-wrap:wrap}
.statbox{background:#0b1829;border-radius:6px;padding:5px 10px;text-align:center;border:1px solid}
.statlbl{font-size:7px;letter-spacing:2px;color:#374151;margin-bottom:2px}
.statval{font-size:15px;font-weight:700}

/* CAROUSEL (replaces single flip-book) */
/* AUTO-LOOP SLIDESHOW — pure CSS, zero JS timers */
.slideshow{border-radius:10px;overflow:hidden;background:#07111a;border:1px solid;position:relative}
.ss-wrap{position:relative;aspect-ratio:4/3;overflow:hidden}
.ss-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;animation-fill-mode:both;animation-timing-function:ease-in-out}
.ss-src{position:absolute;bottom:8px;right:8px;font-size:8px;color:#94a3b8;
  background:#00000099;padding:2px 8px;border-radius:10px;font-family:'Courier New',monospace}
.ss-bar{display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px;background:#060e18}
.ss-pips{display:flex;gap:5px}
.ss-pip{width:7px;height:7px;border-radius:50%;background:#1e3040}
.ss-hint{font-size:9px;color:#374151;letter-spacing:1px;font-family:'Courier New',monospace}
/* 2-frame loop: each frame visible 50% of 3.6s cycle */
@keyframes ss2 { 0%{opacity:0} 6%{opacity:1} 44%{opacity:1} 50%{opacity:0} 100%{opacity:0} }
.ss-n2 .ss-frame { animation: ss2 3.6s infinite; }
.ss-n2 .ss-frame:nth-child(1){ animation-delay:0s }
.ss-n2 .ss-frame:nth-child(2){ animation-delay:1.8s }
/* 4-frame loop: each frame visible 25% of 7.2s cycle */
@keyframes ss4 { 0%{opacity:0} 4%{opacity:1} 21%{opacity:1} 25%{opacity:0} 100%{opacity:0} }
.ss-n4 .ss-frame { animation: ss4 7.2s infinite; }
.ss-n4 .ss-frame:nth-child(1){ animation-delay:0s }
.ss-n4 .ss-frame:nth-child(2){ animation-delay:1.8s }
.ss-n4 .ss-frame:nth-child(3){ animation-delay:3.6s }
.ss-n4 .ss-frame:nth-child(4){ animation-delay:5.4s }
/* Active pip matches current frame — driven by animation timing */
@keyframes pip2 { 0%{background:var(--cc)} 50%,100%{background:#1e3040} }
@keyframes pip4 { 0%{background:var(--cc)} 25%,100%{background:#1e3040} }
.ss-n2 .ss-pip:nth-child(1){ animation: pip2 3.6s 0s infinite }
.ss-n2 .ss-pip:nth-child(2){ animation: pip2 3.6s 1.8s infinite }
.ss-n4 .ss-pip:nth-child(1){ animation: pip4 7.2s 0s infinite }
.ss-n4 .ss-pip:nth-child(2){ animation: pip4 7.2s 1.8s infinite }
.ss-n4 .ss-pip:nth-child(3){ animation: pip4 7.2s 3.6s infinite }
.ss-n4 .ss-pip:nth-child(4){ animation: pip4 7.2s 5.4s infinite }

/* MUSCLES */
.muscles{display:flex;flex-wrap:wrap;gap:5px}
.mtag{font-size:8px;padding:3px 8px;border-radius:10px;letter-spacing:.5px;border:1px solid}
/* CUE */
.cuebox{padding:11px 12px;background:#0b1829;border-radius:6px;border-left:3px solid}
.cuelbl{font-size:8px;letter-spacing:2px;margin-bottom:4px}
.cuetext{font-size:12px;color:#94a3b8;line-height:1.7;font-style:italic}
/* BUTTONS */
.markbtn{width:100%;padding:14px;border-radius:8px;font-size:11px;font-weight:700;
  letter-spacing:2px;transition:all .2s;border:1px solid}
.markbtn.done{background:#15803d;border-color:#22c55e;color:#fff}
.navrow{display:flex;gap:8px}
.navbtn{flex:1;padding:11px;border-radius:7px;font-size:10px;letter-spacing:1px;
  transition:all .2s;border:1px solid}
.navbtn:disabled{opacity:.25;cursor:default}
.spad{height:max(20px,env(safe-area-inset-bottom,20px))}
/* BANNER */
.banner{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,16px));
  left:16px;right:16px;background:#071a0f;border:1px solid #22c55e;
  border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 32px #000a;animation:banin .3s ease forwards,banout .4s ease 3.8s forwards}
@keyframes banin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes banout{to{transform:translateY(20px);opacity:0;pointer-events:none}}
</style>
</head>

     cue:'Rotate through all 4 areas shown. 30-45 sec per tight spot — roll SLOWLY and pause on tender spots. Order: calves → quads → IT band → glutes → lats.'},
    {name:'Static Stretching',type:'recovery',img:'staticstr',sets:'1',reps:'15 min',rpe:'2',
     muscles:['Full Body'],
     cue:'Rotate through all 4 stretches shown. Hold 30-60 sec each. Focus on what\'s sore from Saturday. Breathe out to go deeper. Never bounce.'},
    {name:'Meal Prep',type:'admin',img:'mealprep',sets:'—',reps:'Priority',rpe:'—',
     muscles:['Nutrition'],
     cue:'Prep 4-5 days of meals. Target 165g protein daily: chicken breast, ground beef, eggs, cottage cheese, Greek yogurt. This single habit drives 80% of your recomp results.'},
    {name:'Hydration Check',type:'admin',img:'hydration',sets:'—',reps:'3-4 liters',rpe:'—',
     muscles:['Recovery'],
     cue:'3-4 liters spread throughout the day. Add electrolytes (sodium, potassium, magnesium) on training days. Dehydration reduces fat oxidation by 30%.'},
    {name:'Sleep Optimization',type:'admin',img:'sleep',sets:'—',reps:'7-9 hours',rpe:'—',
     muscles:['Recovery','Hormones'],
     cue:'Growth hormone peaks during Stage 3-4 sleep — this is when fat is metabolized and muscle is built. Dark room, cool (65-68°F). Consistent bedtime matters more than duration.'},
    {name:'Review & Log the Week',type:'admin',img:'logweek',sets:'—',reps:'10 min',rpe:'—',
     muscles:['Progressive Overload'],
     cue:'Write every weight lifted this week. Plan to add 2.5-5 lbs to deadlifts and squats next week. Add 1 rep to rows and presses. This 10 minutes is what makes recomp work.'},
  ]},
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let S={
  dayIdx:(()=>{const d=new Date().getDay();return d===0?6:d-1;})(),
  selEx:null, view:'list',
  completed:JSON.parse(localStorage.getItem('rc_done')||'{}'),
};
function save(){localStorage.setItem('rc_done',JSON.stringify(S.completed));}
function key(di,ei){return `${di}-${ei}`;}
function dayDone(di){return WEEK[di].exercises.filter((_,ei)=>S.completed[key(di,ei)]).length;}
function totalDone(){return WEEK.reduce((a,_,di)=>a+dayDone(di),0);}
function totalEx(){return WEEK.reduce((a,d)=>a+d.exercises.length,0);}

// ─── SCROLL PRESERVATION ─────────────────────────────────────────────────────
// Save scroll positions of both panes before any re-render; restore after
let _listScroll=0, _detScroll=0;
function saveScroll(){
  const l=document.querySelector('.exlist');
  const d=document.querySelector('.detail');
  if(l)_listScroll=l.scrollTop;
  if(d)_detScroll=d.scrollTop;
}
function restoreScroll(){
  const l=document.querySelector('.exlist');
  const d=document.querySelector('.detail');
  if(l)l.scrollTop=_listScroll;
  if(d)d.scrollTop=_detScroll;
}

// ─── SLIDESHOW: pure CSS animation — no JS timers needed ─────────────────────
// stopSlideshow kept as no-op so old call sites don't throw
function stopSlideshow(){}

// ─── COMPLETE ALL / RESET DAY ────────────────────────────────────────────────
function completeAll(di){
  WEEK[di].exercises.forEach((_,ei)=>{S.completed[key(di,ei)]=true;});
  save();render();
}
function uncompleteAll(di){
  WEEK[di].exercises.forEach((_,ei)=>{delete S.completed[key(di,ei)];});
  save();render();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  try{
  saveScroll();
  const root=document.getElementById('root');
  const today=WEEK[S.dayIdx];
  const c=today.color;
  const pct=Math.round((totalDone()/totalEx())*100);
  const dDone=dayDone(S.dayIdx);
  const isDetail=S.view==='detail'&&S.selEx!==null;

  let detailHtml='';
  if(isDetail){
    const ex=today.exercises[S.selEx];
    const k=key(S.dayIdx,S.selEx);
    const isDone=!!S.completed[k];
    const tc=TC[ex.type]||c;
    const slides=IMG[ex.img]||IMG.recwalk;

    let statsHtml='';
    [['SETS',ex.sets],['REPS',ex.reps],['RPE',ex.rpe]].forEach(function(p){
      if(p[1]==='\u2014')return;
      statsHtml+='<div class="statbox" style="border-color:'+tc+'35">'+
        '<div class="statlbl">'+p[0]+'</div>'+
        '<div class="statval" style="color:'+tc+'">'+p[1]+'</div></div>';
    });

    const nClass = slides.length===4 ? 'ss-n4' : 'ss-n2';
    let frameHtml='';
    slides.forEach(function(s,i){
      frameHtml+='<img class="ss-frame" src="'+s.u+'" alt="'+s.l+'" '+
        'loading="'+(i===0?'eager':'lazy')+'" onerror="this.style.opacity=0.12">';
    });
    let pipHtml='';
    slides.forEach(function(){ pipHtml+='<div class="ss-pip"></div>'; });
    let muscleHtml='';
    ex.muscles.forEach(function(m){
      muscleHtml+='<span class="mtag" style="background:'+tc+'18;color:'+tc+
        ';border-color:'+tc+'30">'+m+'</span>';
    });

    const isLast = S.selEx===today.exercises.length-1;
    const markStyle = isDone ? '' : 'background:'+tc+'20;border-color:'+tc+';color:'+tc;
    const nextStyle = isLast
      ? 'background:transparent;border-color:'+c+';color:'+c
      : 'background:'+c+';border-color:'+c+';color:#fff';

    detailHtml=
      '<div class="detail"><div class="detail-inner">'+
        '<button class="backbtn" onclick="goBack()">\u2190 BACK</button>'+
        '<div><div class="detype" style="color:'+tc+'">'+ex.type.toUpperCase()+'</div>'+
        '<div class="denm">'+ex.name+'</div></div>'+
        '<div class="statsrow">'+statsHtml+'</div>'+
        '<div class="slideshow '+nClass+'" style="border-color:'+tc+'30">'+
          '<div class="ss-wrap">'+frameHtml+
            '<div class="ss-src">free-exercise-db</div></div>'+
          '<div class="ss-bar">'+
            '<div class="ss-hint">AUTO-LOOP</div>'+
            '<div class="ss-pips" style="--cc:'+tc+'">'+pipHtml+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="muscles">'+muscleHtml+'</div>'+
        '<div class="cuebox" style="border-color:'+tc+'">'+
          '<div class="cuelbl" style="color:'+tc+'">\u26a1 COACHING CUE</div>'+
          '<p class="cuetext">"'+ex.cue+'"</p>'+
        '</div>'+
        '<button class="markbtn'+(isDone?' done':'')+'" style="'+markStyle+'" '+
          'onclick="toggleDone('+S.dayIdx+','+S.selEx+')">'+
          (isDone?'\u2713  COMPLETED':'MARK COMPLETE')+'</button>'+
        '<div class="navrow">'+
          '<button class="navbtn" style="background:transparent;border-color:#1e3040;color:#374151" '+
            'onclick="navEx(-1)" '+(S.selEx===0?'disabled':'')+'>\u2190 PREV</button>'+
          '<button class="navbtn" style="'+nextStyle+'" '+
            'onclick="navEx(1)" '+(isLast?'disabled':'')+'>NEXT \u2192</button>'+
        '</div>'+
        '<div class="spad"></div>'+
      '</div></div>';
  }

  const listItems=today.exercises.map((ex,ei)=>{
    const k=key(S.dayIdx,ei);
    const isDone=!!S.completed[k];
    const tc=TC[ex.type]||c;
    const isSel=S.selEx===ei&&isDetail;
    return `<div class="exrow${isSel?' sel':''}" style="--c:${c};${isSel?'background:'+c+'10':''}"
      onclick="selectEx(${ei})">
      <div class="exdot${isDone?' done':''}"></div>
      <div style="flex:1;min-width:0">
        <div class="exnm">${ex.name}</div>
        <div class="exmeta">
          <span class="extlbl" style="color:${tc}">${ex.type.toUpperCase()}</span>
          ${ex.sets!=='—'?`<span class="exsets">${ex.sets}×${ex.reps}</span>`:''}
        </div>
      </div>
      <button class="donebtn${isDone?' chk':''}"
        onclick="event.stopPropagation();toggleDone(${S.dayIdx},${ei})">
        ${isDone?'✓':'○'}
      </button>
    </div>`;
  }).join('');

  const bannerHtml=dDone===today.exercises.length?`
    <div class="banner">
      <span style="font-size:28px">🏆</span>
      <div>
        <div style="font-size:12px;color:#22c55e;font-weight:700;letter-spacing:1px">
          ${today.fullDay.toUpperCase()} COMPLETE</div>
        <div style="font-size:9px;color:#374151;margin-top:2px">
          ${S.dayIdx<6?'Next: '+WEEK[S.dayIdx+1].fullDay+' — '+WEEK[S.dayIdx+1].label:'Full week done! 🎉'}</div>
      </div>
    </div>`:'';

  root.innerHTML=`
    <div class="hdr">
      <div class="hdr-top">
        <div><div class="hdr-sub">20% → 11% BF · RECOMP PLAN</div>
          <div class="hdr-ttl">7-DAY ROUTINE</div></div>
        <div><div class="hdr-pct" style="color:${c}">${pct}%</div>
          <div class="hdr-plbl">WEEKLY</div></div>
      </div>
      <div class="pbar"><div class="pfill" style="width:${pct}%;background:linear-gradient(90deg,${c},#10b981)"></div></div>
      <div class="dtabs" id="dayTabs">
        ${WEEK.map((day,di)=>{
          const dd=dayDone(di),tot=day.exercises.length;
          const filled=Math.round((dd/tot)*5);
          const dots=Array.from({length:Math.min(tot,5)},(_,i)=>
            `<div class="dot${i<filled?' on':''}"></div>`).join('');
          return `<button class="dtab${di===S.dayIdx?' on':''}" style="--c:${day.color}"
            onclick="selectDay(${di})">
            <span class="em">${day.emoji}</span>
            <span class="lb">${day.day}</span>
            <div class="dots">${dots}</div>
          </button>`;
        }).join('')}
      </div>
    </div>

    <div class="dhdr" style="background:linear-gradient(135deg,${c}10 0%,transparent 100%)">
      <div class="dhdr-row">
        <div style="flex:1">
          <div class="dtp" style="color:${c}">${today.isRest?'REST & RECOVERY':'TRAINING DAY'} · ${today.duration}</div>
          <div class="dnm">${today.emoji} ${today.label}</div>
          <div class="dsub">${today.sublabel}</div>
        </div>
        <div class="dctr" style="background:${c}20;border:1px solid ${c}40;color:${c}">${dDone}/${today.exercises.length}</div>
      </div>
      <div class="dgoal" style="border-color:${c}40">${today.goal}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="completeAll(${S.dayIdx})"
          style="flex:1;padding:9px 0;border-radius:7px;font-size:10px;font-weight:700;
            letter-spacing:1.5px;background:${c}22;border:1px solid ${c}55;color:${c};
            font-family:'Courier New',monospace">✓ COMPLETE ALL</button>
        <button onclick="uncompleteAll(${S.dayIdx})"
          style="flex:1;padding:9px 0;border-radius:7px;font-size:10px;font-weight:700;
            letter-spacing:1.5px;background:transparent;border:1px solid #1e3040;color:#374151;
            font-family:'Courier New',monospace">↺ RESET DAY</button>
      </div>
    </div>

    <div class="body">
      <div class="exlist ${isDetail?'split':'full'}">
        ${listItems}
        <div style="height:max(16px,env(safe-area-inset-bottom,16px))"></div>
      </div>
      ${detailHtml}
    </div>
    ${bannerHtml}`;

  // Restore scroll AFTER DOM is written — CSS handles animation, nothing else needed
  requestAnimationFrame(restoreScroll);
  // NOTE: intentionally NOT scrolling day tabs — user controls that
  }catch(e){console.error('render error:',e);}
}

// ─── EVENT HANDLERS ───────────────────────────────────────────────────────────
function selectDay(di){
  if(S.selEx!==null)stopSlideshow(key(S.dayIdx,S.selEx));
  _listScroll=0;_detScroll=0;S.dayIdx=di;S.selEx=null;S.view='list';render();
}
function selectEx(ei){
  if(S.selEx!==null)stopSlideshow(key(S.dayIdx,S.selEx));
  if(S.selEx===ei&&S.view==='detail'){S.selEx=null;S.view='list';}
  else{_detScroll=0;S.selEx=ei;S.view='detail';}
  render();
}
function goBack(){
  if(S.selEx!==null)stopSlideshow(key(S.dayIdx,S.selEx));
  S.view='list';render();
}
function navEx(dir){
  const n=S.selEx+dir;
  if(n>=0&&n<WEEK[S.dayIdx].exercises.length){_detScroll=0;S.selEx=n;render();}
}
function toggleDone(di,ei){
  // Save scroll before state change
  saveScroll();
  const k=key(di,ei);S.completed[k]=!S.completed[k];
  save();
  // Render and restore — scroll stays exactly where it was
  render();
}

render();
</script>
</body>
</html>
