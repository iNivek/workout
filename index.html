<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Recomp Plan"/>
<meta name="theme-color" content="#070d14"/>
<title>7-Day Recomp Workout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{height:100%;height:-webkit-fill-available}
body{font-family:'Courier New',Courier,monospace;color:#94a3b8;background:#070d14;height:100%;height:-webkit-fill-available;overflow:hidden}
button{-webkit-appearance:none;font-family:'Courier New',Courier,monospace;cursor:pointer;border:none}
a{text-decoration:none}
::-webkit-scrollbar{display:none}

#root{
  display:flex;flex-direction:column;
  height:100svh;height:-webkit-fill-available;
  max-width:480px;margin:0 auto;
  background:#070d14;overflow:hidden;position:relative;
}

/* HEADER */
.hdr{background:linear-gradient(160deg,#0c1929 0%,#100b1e 100%);border-bottom:1px solid #0d1e2e;flex-shrink:0;
  padding-top:max(14px,env(safe-area-inset-top,14px));padding-left:16px;padding-right:16px;padding-bottom:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-subtitle{font-size:8px;color:#1e3040;letter-spacing:3px;margin-bottom:2px}
.hdr-title{font-size:18px;font-weight:700;color:#e2e8f0;letter-spacing:1px}
.hdr-pct{font-size:22px;font-weight:700;text-align:right}
.hdr-pct-label{font-size:8px;color:#1e3040;letter-spacing:1px}
.progress-bar{height:2px;background:#0d1e2e;overflow:hidden}
.progress-fill{height:100%;transition:width .5s ease;border-radius:1px}
.day-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.day-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 14px;
  background:transparent;border-bottom:2px solid transparent;min-width:58px;transition:all .2s}
.day-tab.active{border-bottom-color:var(--c)}
.day-tab .emoji{font-size:19px;line-height:1}
.day-tab .lbl{font-size:10px;font-weight:700;letter-spacing:1px;color:#4b5563;transition:color .2s}
.day-tab.active .lbl{color:var(--c)}
.dots{display:flex;gap:2px;margin-top:1px}
.dot{width:4px;height:4px;border-radius:50%;background:#1e2d3e;transition:background .3s}
.dot.filled{background:var(--c)}

/* DAY HEADER */
.day-hdr{padding:12px 16px 10px;border-bottom:1px solid #0d1e2e;flex-shrink:0}
.day-hdr-inner{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day-type{font-size:8px;letter-spacing:3px;margin-bottom:3px}
.day-name{font-size:17px;font-weight:700;color:#e2e8f0;line-height:1.2}
.day-sub{font-size:11px;color:#374151;margin-top:1px}
.day-counter{border-radius:20px;padding:4px 12px;flex-shrink:0;font-size:11px;font-weight:700}
.day-goal{font-size:10px;color:#1e3a52;margin-top:7px;line-height:1.5;border-left:2px solid;padding-left:8px}

/* BODY */
.body{flex:1;display:flex;overflow:hidden}
.ex-list{overflow-y:auto;-webkit-overflow-scrolling:touch;transition:width .25s ease;flex-shrink:0}
.ex-list.full{width:100%}
.ex-list.split{width:38%;border-right:1px solid #0d1e2e}
.ex-row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#0b1520;
  border-left:3px solid transparent;border-bottom:1px solid #0d1c2a;cursor:pointer;transition:all .15s;user-select:none}
.ex-row.sel{border-left-color:var(--c)}
.ex-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#1e3040;transition:all .3s}
.ex-dot.ready{background:#22c55e}
.ex-name{font-size:12px;font-weight:600;line-height:1.35;color:#64748b;margin-bottom:3px;transition:color .15s}
.ex-row.sel .ex-name{color:#f1f5f9}
.ex-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-type-label{font-size:8px;letter-spacing:1.5px}
.ex-sets{font-size:10px;color:#374151}
.done-btn{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:transparent;
  border:2px solid #1e3040;color:#1e3040;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.done-btn.checked{background:#15803d;border-color:#22c55e;color:#fff}

/* DETAIL */
.detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#08111a}
.detail-inner{padding:12px 14px}
.back-btn{background:transparent;color:#374151;padding:4px 0;font-size:11px;letter-spacing:1px;margin-bottom:8px;display:block}
.det-type{font-size:8px;letter-spacing:2px;margin-bottom:3px}
.det-name{font-size:14px;font-weight:700;color:#e2e8f0;line-height:1.35;margin-bottom:10px}
.stats-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.stat-box{background:#0b1829;border-radius:6px;padding:5px 10px;text-align:center;border:1px solid}
.stat-lbl{font-size:7px;letter-spacing:2px;color:#374151;margin-bottom:2px}
.stat-val{font-size:15px;font-weight:700}

/* SVG ANIM CARD */
.anim-card{border-radius:10px;overflow:hidden;background:#070e18;border:1px solid;padding:0;margin-bottom:0}
.anim-card svg{display:block;width:100%;height:auto}

/* MUSCLES */
.muscles{display:flex;flex-wrap:wrap;gap:5px}
.muscle-tag{font-size:8px;padding:3px 8px;border-radius:10px;letter-spacing:.5px;border:1px solid}

/* CUE */
.cue-box{padding:11px 12px;background:#0b1829;border-radius:6px;border-left:3px solid}
.cue-lbl{font-size:8px;letter-spacing:2px;margin-bottom:4px}
.cue-text{font-size:12px;color:#94a3b8;line-height:1.7;font-style:italic}

/* MARK DONE */
.mark-btn{width:100%;padding:14px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:2px;transition:all .2s;border:1px solid}
.mark-btn.done{background:#15803d;border-color:#22c55e;color:#fff}

/* NAV */
.nav-row{display:flex;gap:8px}
.nav-btn{flex:1;padding:11px;border-radius:7px;font-size:10px;letter-spacing:1px;transition:all .2s;border:1px solid}
.nav-btn:disabled{opacity:.25;cursor:default}

/* SECTION SPACING */
.detail-section{display:flex;flex-direction:column;gap:10px}

/* COMPLETE BANNER */
.complete-banner{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,16px));left:16px;right:16px;
  background:#071a0f;border:1px solid #22c55e;border-radius:12px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px #000a;animation:slideup .3s ease}
.banner-icon{font-size:28px}
.banner-title{font-size:12px;color:#22c55e;font-weight:700;letter-spacing:1px}
.banner-sub{font-size:9px;color:#374151;margin-top:2px}

@keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script>

// ─── SVG EXERCISE ANIMATIONS ─────────────────────────────────────────────────
// Each returns a complete inline SVG with CSS-animated stick figure
// Two frames (A=start, B=end) fade-swap at 2s cycle

function exSVG(type, c) {
  const b = '#4a5568'; // body stroke
  const s = 2.5;       // stroke width
  // shared keyframe CSS injected once per SVG
  const K = (id) => `<style>
    .${id}-a{animation:${id}-fa 2.2s ease-in-out infinite}
    .${id}-b{animation:${id}-fb 2.2s ease-in-out infinite}
    @keyframes ${id}-fa{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
    @keyframes ${id}-fb{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
  </style>`;

  const wrap = (id, body, label) =>
    `<svg viewBox="0 0 200 244" xmlns="http://www.w3.org/2000/svg">
    <defs>${K(id)}</defs>
    <circle cx="100" cy="122" r="88" fill="${c}" opacity="0.06"/>
    ${body}
    <text x="100" y="240" text-anchor="middle" fill="${c}" font-size="9"
      font-family="Courier New,monospace" letter-spacing="2" opacity="0.75">${label}</text>
    </svg>`;

  // shared attr strings
  const BA = `stroke="${b}" stroke-width="${s}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const CA = `stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"`;
  const head = (cx,cy) => `<circle cx="${cx}" cy="${cy}" r="13" stroke="${b}" stroke-width="2.5" fill="none"/>`;

  const T = {

    // ── SQUAT ──────────────────────────────────────────────────────────────
    squat: wrap('sq', `
      <g class="sq-a" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="60" y2="88"/><line x1="60" y1="88" x2="55" y2="115"/>
        <line x1="128" y1="58" x2="140" y2="88"/><line x1="140" y1="88" x2="145" y2="115"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="162" stroke="${c}" stroke-width="3"/>
        <line x1="76" y1="162" x2="72" y2="205" stroke="${c}" stroke-width="3"/>
        <line x1="120" y1="115" x2="124" y2="162" stroke="${c}" stroke-width="3"/>
        <line x1="124" y1="162" x2="128" y2="205" stroke="${c}" stroke-width="3"/>
      </g>
      <g class="sq-b" ${BA}>
        ${head(102,68)}
        <line x1="102" y1="81" x2="104" y2="138"/>
        <line x1="76" y1="98" x2="130" y2="98"/>
        <line x1="76" y1="98" x2="84" y2="112"/><line x1="84" y1="112" x2="92" y2="103"/>
        <line x1="130" y1="98" x2="122" y2="112"/><line x1="122" y1="112" x2="114" y2="103"/>
        <rect x="91" y="95" width="20" height="13" rx="3" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="76" y1="138" x2="128" y2="138"/>
        <line x1="76" y1="138" x2="52" y2="180" stroke="${c}" stroke-width="3"/>
        <line x1="52" y1="180" x2="50" y2="218" stroke="${c}" stroke-width="3"/>
        <line x1="128" y1="138" x2="150" y2="180" stroke="${c}" stroke-width="3"/>
        <line x1="150" y1="180" x2="152" y2="218" stroke="${c}" stroke-width="3"/>
      </g>`, 'SQUAT — DRIVE THROUGH HEELS'),

    // ── DEADLIFT / HIP HINGE ────────────────────────────────────────────────
    deadlift: wrap('dl', `
      <g class="dl-a" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="60" y2="88"/><line x1="60" y1="88" x2="56" y2="118"/>
        <line x1="128" y1="58" x2="140" y2="88"/><line x1="140" y1="88" x2="144" y2="118"/>
        <rect x="78" y="115" width="44" height="12" rx="3" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="160" stroke="${c}" stroke-width="3"/>
        <line x1="76" y1="160" x2="72" y2="205" stroke="${c}" stroke-width="3"/>
        <line x1="120" y1="115" x2="124" y2="160" stroke="${c}" stroke-width="3"/>
        <line x1="124" y1="160" x2="128" y2="205" stroke="${c}" stroke-width="3"/>
      </g>
      <g class="dl-b" ${BA}>
        ${head(56,90)}
        <line x1="64" y1="100" x2="138" y2="125"/>
        <line x1="80" y1="108" x2="70" y2="130"/><line x1="70" y1="130" x2="58" y2="152"/>
        <line x1="120" y1="118" x2="110" y2="140"/><line x1="110" y1="140" x2="100" y2="162"/>
        <rect x="58" y="154" width="44" height="10" rx="3" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="130" y1="124" x2="140" y2="155"/>
        <line x1="140" y1="155" x2="136" y2="200" stroke="${c}" stroke-width="3"/>
        <line x1="148" y1="154" x2="155" y2="198" stroke="${c}" stroke-width="3"/>
        <line x1="136" y1="124" x2="148" y2="154"/>
      </g>`, 'HINGE HIPS BACK — FLAT BACK'),

    // ── LUNGE ───────────────────────────────────────────────────────────────
    lunge: wrap('ln', `
      <g class="ln-a" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="60" y2="88"/><line x1="60" y1="88" x2="55" y2="115"/>
        <line x1="128" y1="58" x2="140" y2="88"/><line x1="140" y1="88" x2="145" y2="115"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="162"/><line x1="76" y1="162" x2="72" y2="205"/>
        <line x1="120" y1="115" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="205"/>
      </g>
      <g class="ln-b" ${BA}>
        ${head(96,38)}
        <line x1="96" y1="51" x2="97" y2="120"/>
        <line x1="70" y1="68" x2="124" y2="68"/>
        <line x1="70" y1="68" x2="60" y2="96"/><line x1="60" y1="96" x2="55" y2="120"/>
        <line x1="124" y1="68" x2="134" y2="96"/><line x1="134" y1="96" x2="139" y2="120"/>
        <line x1="78" y1="120" x2="116" y2="120"/>
        <line x1="78" y1="120" x2="56" y2="162" stroke="${c}" stroke-width="3"/>
        <line x1="56" y1="162" x2="46" y2="210" stroke="${c}" stroke-width="3"/>
        <line x1="116" y1="120" x2="148" y2="158" stroke="${c}" stroke-width="3"/>
        <line x1="148" y1="158" x2="158" y2="175"/>
        <circle cx="148" cy="210" r="5" stroke="${c}" stroke-width="2" fill="none"/>
      </g>`, 'LONG STRIDE — KNEE OVER ANKLE'),

    // ── PRESS (overhead / chest) ─────────────────────────────────────────────
    press: wrap('pr', `
      <g class="pr-a" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="62" y2="86"/><line x1="62" y1="86" x2="68" y2="74"/>
        <line x1="128" y1="58" x2="138" y2="86"/><line x1="138" y1="86" x2="132" y2="74"/>
        <rect x="78" y="66" width="44" height="12" rx="3" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="162"/><line x1="76" y1="162" x2="72" y2="205"/>
        <line x1="120" y1="115" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="205"/>
      </g>
      <g class="pr-b" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="55" y2="36" stroke="${c}" stroke-width="3"/>
        <line x1="55" y1="36" x2="46" y2="20" stroke="${c}" stroke-width="3"/>
        <line x1="128" y1="58" x2="145" y2="36" stroke="${c}" stroke-width="3"/>
        <line x1="145" y1="36" x2="154" y2="20" stroke="${c}" stroke-width="3"/>
        <rect x="74" y="12" width="52" height="12" rx="3" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="162"/><line x1="76" y1="162" x2="72" y2="205"/>
        <line x1="120" y1="115" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="205"/>
      </g>`, 'PRESS — FULL EXTENSION'),

    // ── ROW / PULL ───────────────────────────────────────────────────────────
    row: wrap('rw', `
      <g class="rw-a" ${BA}>
        ${head(60,72)}
        <line x1="68" y1="83" x2="140" y2="108"/>
        <line x1="82" y1="90" x2="70" y2="116"/><line x1="70" y1="116" x2="56" y2="140"/>
        <line x1="116" y1="102" x2="104" y2="128"/><line x1="104" y1="128" x2="90" y2="152"/>
        <line x1="134" y1="108" x2="144" y2="140"/>
        <line x1="144" y1="140" x2="138" y2="186"/>
        <line x1="150" y1="140" x2="156" y2="184"/>
        <line x1="140" y1="107" x2="152" y2="138"/>
      </g>
      <g class="rw-b" ${BA}>
        ${head(60,72)}
        <line x1="68" y1="83" x2="140" y2="108"/>
        <line x1="82" y1="90" x2="78" y2="102" stroke="${c}" stroke-width="3"/>
        <line x1="78" y1="102" x2="82" y2="88" stroke="${c}" stroke-width="3"/>
        <line x1="116" y1="102" x2="112" y2="114" stroke="${c}" stroke-width="3"/>
        <line x1="112" y1="114" x2="116" y2="100" stroke="${c}" stroke-width="3"/>
        <line x1="134" y1="108" x2="144" y2="140"/>
        <line x1="144" y1="140" x2="138" y2="186"/>
        <line x1="150" y1="140" x2="156" y2="184"/>
        <line x1="140" y1="107" x2="152" y2="138"/>
        <line x1="56" y1="80" x2="48" y2="106" stroke="${c}" stroke-width="3"/>
        <line x1="48" y1="106" x2="58" y2="94" stroke="${c}" stroke-width="3"/>
      </g>`, 'ELBOWS PAST HIPS — SQUEEZE'),

    // ── CURL ─────────────────────────────────────────────────────────────────
    curl: wrap('cu', `
      <g class="cu-a" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="62" y2="88"/>
        <line x1="62" y1="88" x2="56" y2="118"/>
        <line x1="128" y1="58" x2="138" y2="88"/>
        <line x1="138" y1="88" x2="144" y2="118"/>
        <circle cx="52" cy="122" r="7" stroke="${c}" stroke-width="2" fill="none"/>
        <circle cx="148" cy="122" r="7" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="162"/><line x1="76" y1="162" x2="72" y2="205"/>
        <line x1="120" y1="115" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="205"/>
      </g>
      <g class="cu-b" ${BA}>
        ${head(100,28)}
        <line x1="100" y1="41" x2="100" y2="115"/>
        <line x1="72" y1="58" x2="128" y2="58"/>
        <line x1="72" y1="58" x2="62" y2="88"/>
        <line x1="62" y1="88" x2="70" y2="62" stroke="${c}" stroke-width="3"/>
        <line x1="128" y1="58" x2="138" y2="88"/>
        <line x1="138" y1="88" x2="130" y2="62" stroke="${c}" stroke-width="3"/>
        <circle cx="68" cy="56" r="7" stroke="${c}" stroke-width="2" fill="none"/>
        <circle cx="132" cy="56" r="7" stroke="${c}" stroke-width="2" fill="none"/>
        <line x1="80" y1="115" x2="120" y2="115"/>
        <line x1="80" y1="115" x2="76" y2="162"/><line x1="76" y1="162" x2="72" y2="205"/>
        <line x1="120" y1="115" x2="124" y2="162"/><line x1="124" y1="162" x2="128" y2="205"/>
      </g>`, 'ELBOWS PINNED — 3-SEC DOWN'),

    // ── CORE / PLANK ──────────────────────────────────────────────────────────
    core: wrap('co', `
      <g class="co-a" ${BA}>
        ${head(34,105)}
        <line x1="42" y1="115" x2="148" y2="122"/>
        <line x1="56" y1="118" x2="58" y2="148"/>
        <line x1="66" y1="118" x2="66" y2="148"/>
        <line x1="58" y1="148" x2="54" y2="180"/><line x1="66" y1="148" x2="66" y2="180"/>
        <line x1="140" y1="122" x2="136" y2="155"/>
        <line x1="148" y1="122" x2="154" y2="155"/>
        <line x1="136" y1="155" x2="132" y2="190"/>
        <line x1="154" y1="155" x2="158" y2="190"/>
      </g>
      <g class="co-b" ${BA}>
        ${head(34,105)}
        <line x1="42" y1="115" x2="148" y2="122"/>
        <line x1="56" y1="118" x2="58" y2="148"/>
        <line x1="66" y1="118" x2="66" y2="148"/>
        <line x1="58" y1="148" x2="44" y2="162" stroke="${c}" stroke-width="3"/>

// ─── STATE ────────────────────────────────────────────────────────────────────
let S = {
  dayIdx: (()=>{ const d=new Date().getDay(); return d===0?6:d-1; })(),
  selEx: null,
  view: 'list',
  completed: JSON.parse(localStorage.getItem('rc_done')||'{}'),
};
function saveCompleted(){localStorage.setItem('rc_done',JSON.stringify(S.completed));}
function key(di,ei){return `${di}-${ei}`;}
function dayDone(di){return WEEK[di].exercises.filter((_,ei)=>S.completed[key(di,ei)]).length;}
function totalDone(){return WEEK.reduce((a,_,di)=>a+dayDone(di),0);}
function totalEx(){return WEEK.reduce((a,d)=>a+d.exercises.length,0);}

  const root=document.getElementById('root');
  const today=WEEK[S.dayIdx];

  const pct=Math.round((totalDone()/totalEx())*100);
  const dDone=dayDone(S.dayIdx);
  const isDetail=S.view==='detail'&&S.selEx!==null;

  let detailHtml='';
  if(isDetail){
    const ex=today.exercises[S.selEx];
    const k=key(S.dayIdx,S.selEx);
    const isDone=!!S.completed[k];
    const tc=TYPE_COLORS[ex.type]||c;
    const svgType=ANIM[ex.animType]||ANIM[ex.type]||'stretch';
    const statsHtml=[['SETS',ex.sets],['REPS',ex.reps],['RPE',ex.rpe]]
      .filter(([,v])=>v!=='—')
      .map(([l,v])=>`<div class="stat-box" style="border-color:${tc}35"><div class="stat-lbl">${l}</div><div class="stat-val" style="color:${tc}">${v}</div></div>`)
      .join('');
    const muscleHtml=ex.muscles.map(m=>`<span class="muscle-tag" style="background:${tc}18;color:${tc};border-color:${tc}30">${m}</span>`).join('');

    detailHtml=`<div class="detail">
      <div class="detail-inner">
        <div class="detail-section">
          <button class="back-btn" onclick="goBack()">← BACK</button>
          <div>
            <div class="det-type" style="color:${tc}">${ex.type.toUpperCase()}</div>
            <div class="det-name">${ex.name}</div>
          </div>
          <div class="stats-row">${statsHtml}</div>

          <!-- ANIMATED SVG ILLUSTRATION -->
          <div class="anim-card" style="border-color:${tc}25">
            ${exSVG(svgType, c)}
          </div>

          <div class="muscles">${muscleHtml}</div>

          <div class="cue-box" style="border-color:${tc}">
            <div class="cue-lbl" style="color:${tc}">⚡ COACHING CUE</div>
            <p class="cue-text">"${ex.cue}"</p>
          </div>

          <button class="mark-btn ${isDone?'done':''}"
            style="${isDone?'':'background:'+tc+'20;border-color:'+tc+';color:'+tc}"
            onclick="toggleDone(${S.dayIdx},${S.selEx})">
            ${isDone?'✓  COMPLETED':'MARK COMPLETE'}
          </button>

          <div class="nav-row">
            <button class="nav-btn" style="background:transparent;border-color:#1e3040;color:#374151"
              onclick="navEx(-1)" ${S.selEx===0?'disabled':''}>← PREV</button>
            <button class="nav-btn"
              style="background:${S.selEx===today.exercises.length-1?'transparent':c};border-color:${c};color:${S.selEx===today.exercises.length-1?c:'#fff'}"
              onclick="navEx(1)" ${S.selEx===today.exercises.length-1?'disabled':''}>NEXT →</button>
          </div>
          <div style="height:max(20px,env(safe-area-inset-bottom,20px))"></div>
        </div>
      </div>
    </div>`;
  }

  const listItems=today.exercises.map((ex,ei)=>{
    const k=key(S.dayIdx,ei);
    const isDone=!!S.completed[k];
    const tc=TYPE_COLORS[ex.type]||c;
    const isSel=S.selEx===ei&&isDetail;
    return `<div class="ex-row${isSel?' sel':''}" style="--c:${c};${isSel?'background:'+c+'10':''}" onclick="selectEx(${ei})">
      <div class="ex-dot${isDone?' ready':''}"></div>
      <div style="flex:1;min-width:0">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">
          <span class="ex-type-label" style="color:${tc}">${ex.type.toUpperCase()}</span>
          ${ex.sets!=='—'?`<span class="ex-sets">${ex.sets}×${ex.reps}</span>`:''}
        </div>
      </div>
      <button class="done-btn${isDone?' checked':''}" onclick="event.stopPropagation();toggleDone(${S.dayIdx},${ei})">
        ${isDone?'✓':'○'}
      </button>
    </div>`;
  }).join('');

  const bannerHtml=dDone===today.exercises.length?`
    <div class="complete-banner">
      <span class="banner-icon">🏆</span>
      <div>
        <div class="banner-title">${today.fullDay.toUpperCase()} COMPLETE</div>
        <div class="banner-sub">${S.dayIdx<6?'Next: '+WEEK[S.dayIdx+1].fullDay+' — '+WEEK[S.dayIdx+1].label:'Full week done! 🎉'}</div>
      </div>
    </div>`:'';

  root.innerHTML=`
    <div class="hdr">
      <div class="hdr-top">
        <div><div class="hdr-subtitle">20% → 11% BF · RECOMP PLAN</div><div class="hdr-title">7-DAY ROUTINE</div></div>
        <div><div class="hdr-pct" style="color:${c}">${pct}%</div><div class="hdr-pct-label">WEEKLY</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${c},#10b981)"></div></div>
      <div class="day-tabs" id="dayTabs">
        ${WEEK.map((day,di)=>{
          const dd=dayDone(di),tot=day.exercises.length;
          const filled=Math.round((dd/tot)*5);
          const dots=Array.from({length:Math.min(tot,5)},(_,i)=>`<div class="dot${i<filled?' filled':''}"></div>`).join('');
          return `<button class="day-tab${di===S.dayIdx?' active':''}" style="--c:${day.color}" onclick="selectDay(${di})">
            <span class="emoji">${day.emoji}</span>
            <span class="lbl">${day.day}</span>
            <div class="dots">${dots}</div>
          </button>`;
        }).join('')}
      </div>
    </div>

    <div class="day-hdr" style="background:linear-gradient(135deg,${c}12 0%,transparent 100%)">
      <div class="day-hdr-inner">
        <div style="flex:1">
          <div class="day-type" style="color:${c}">${today.isRest?'REST & RECOVERY':'TRAINING DAY'} · ${today.duration}</div>
          <div class="day-name">${today.emoji} ${today.label}</div>
          <div class="day-sub">${today.sublabel}</div>
        </div>
        <div class="day-counter" style="background:${c}20;border:1px solid ${c}40;color:${c}">${dDone}/${today.exercises.length}</div>
      </div>
      <div class="day-goal" style="border-color:${c}40">${today.goal}</div>
    </div>

    <div class="body">
      <div class="ex-list ${isDetail?'split':'full'}">
        ${listItems}
        <div style="height:max(16px,env(safe-area-inset-bottom,16px))"></div>
      </div>
      ${detailHtml}
    </div>
    ${bannerHtml}`;

  const tabs=document.getElementById('dayTabs');
  if(tabs){const a=tabs.children[S.dayIdx];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
}

function selectDay(di){S.dayIdx=di;S.selEx=null;S.view='list';render();}
function selectEx(ei){
  if(S.selEx===ei&&S.view==='detail'){S.selEx=null;S.view='list';}
  else{S.selEx=ei;S.view='detail';}
  render();
}
function goBack(){S.view='list';render();}
function navEx(dir){
  const n=S.selEx+dir;
  if(n>=0&&n<WEEK[S.dayIdx].exercises.length){S.selEx=n;render();}
}
function toggleDone(di,ei){
  const k=key(di,ei);S.completed[k]=!S.completed[k];
  saveCompleted();render();
}

render();
</script>
</body>
</html>
