<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Recomp Plan"/>
<meta name="theme-color" content="#070d14"/>
<title>7-Day Recomp Workout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{background:#070d14;overflow:hidden}
html{height:100%;height:-webkit-fill-available}
body{font-family:'Courier New',Courier,monospace;color:#94a3b8;height:100%;height:-webkit-fill-available}
button{-webkit-appearance:none;font-family:'Courier New',Courier,monospace;cursor:pointer;border:none}
::-webkit-scrollbar{display:none}

#root{
  display:flex;flex-direction:column;
  height:100svh;height:-webkit-fill-available;
  max-width:480px;margin:0 auto;
  background:#070d14;overflow:hidden;position:relative;
}

/* HEADER */
.hdr{background:linear-gradient(160deg,#0c1929 0%,#100b1e 100%);border-bottom:1px solid #0d1e2e;flex-shrink:0;
  padding-top:max(14px,env(safe-area-inset-top,14px));padding-left:16px;padding-right:16px;padding-bottom:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-subtitle{font-size:8px;color:#1e3040;letter-spacing:3px;margin-bottom:2px}
.hdr-title{font-size:18px;font-weight:700;color:#e2e8f0;letter-spacing:1px}
.hdr-pct{font-size:22px;font-weight:700;text-align:right}
.hdr-pct-label{font-size:8px;color:#1e3040;letter-spacing:1px}
.progress-bar{height:2px;background:#0d1e2e;overflow:hidden}
.progress-fill{height:100%;transition:width .5s ease}
.day-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.day-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 14px;background:transparent;border-bottom:2px solid transparent;min-width:58px;transition:all .2s}
.day-tab.active{border-bottom-color:var(--c)}
.day-tab .em{font-size:19px;line-height:1}
.day-tab .lb{font-size:10px;font-weight:700;letter-spacing:1px;color:#4b5563;transition:color .2s}
.day-tab.active .lb{color:var(--c)}
.dots{display:flex;gap:2px;margin-top:1px}
.dot{width:4px;height:4px;border-radius:50%;background:#1e2d3e;transition:background .3s}
.dot.on{background:var(--c)}

/* DAY HEADER */
.day-hdr{padding:12px 16px 10px;border-bottom:1px solid #0d1e2e;flex-shrink:0}
.day-hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day-type{font-size:8px;letter-spacing:3px;margin-bottom:3px}
.day-name{font-size:17px;font-weight:700;color:#e2e8f0;line-height:1.2}
.day-sub{font-size:11px;color:#374151;margin-top:1px}
.day-ctr{border-radius:20px;padding:4px 12px;flex-shrink:0;font-size:11px;font-weight:700}
.day-goal{font-size:10px;color:#1e3a52;margin-top:7px;line-height:1.5;border-left:2px solid;padding-left:8px}

/* BODY SPLIT */
.body{flex:1;display:flex;overflow:hidden;min-height:0}
.ex-list{overflow-y:auto;-webkit-overflow-scrolling:touch;transition:width .25s ease;flex-shrink:0}
.ex-list.full{width:100%}
.ex-list.split{width:38%;border-right:1px solid #0d1e2e}

/* EXERCISE ROW */
.ex-row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#0b1520;
  border-left:3px solid transparent;border-bottom:1px solid #0d1c2a;cursor:pointer;transition:all .15s;user-select:none}
.ex-row.sel{border-left-color:var(--c)}
.ex-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#1e3040}
.ex-dot.ready{background:#22c55e}
.ex-name{font-size:12px;font-weight:600;line-height:1.35;color:#64748b;margin-bottom:3px;transition:color .15s}
.ex-row.sel .ex-name{color:#f1f5f9}
.ex-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-type-lbl{font-size:8px;letter-spacing:1.5px}
.ex-sets{font-size:10px;color:#374151}
.done-btn{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:transparent;
  border:2px solid #1e3040;color:#1e3040;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.done-btn.chk{background:#15803d;border-color:#22c55e;color:#fff}

/* DETAIL PANE */
.detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#08111a;min-width:0}
.detail-inner{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.back-btn{background:transparent;color:#374151;padding:4px 0;font-size:11px;letter-spacing:1px;text-align:left}
.det-type{font-size:8px;letter-spacing:2px;margin-bottom:3px}
.det-name{font-size:14px;font-weight:700;color:#e2e8f0;line-height:1.35}
.stats-row{display:flex;gap:6px;flex-wrap:wrap}
.stat-box{background:#0b1829;border-radius:6px;padding:5px 10px;text-align:center;border:1px solid}
.stat-lbl{font-size:7px;letter-spacing:2px;color:#374151;margin-bottom:2px}
.stat-val{font-size:15px;font-weight:700}

/* ── FLIP-BOOK DEMO ── */
.demo-wrap{border-radius:10px;overflow:hidden;position:relative;background:#07111a;border:1px solid}
.demo-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease-in-out}
.demo-frame.hide{opacity:0}
.demo-frame.show{opacity:1}
.demo-spacer{width:100%;aspect-ratio:4/3;display:block}/* keeps height even before imgs load */
.demo-badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;
  letter-spacing:1.5px;padding:3px 9px;border-radius:4px;color:#fff;font-family:'Courier New',monospace}
.demo-src{position:absolute;bottom:8px;right:8px;font-size:8px;color:#94a3b8;
  background:#00000099;padding:2px 8px;border-radius:10px;font-family:'Courier New',monospace}
.demo-label{position:absolute;bottom:8px;left:8px;font-size:9px;font-weight:700;
  letter-spacing:1px;padding:3px 9px;border-radius:4px;font-family:'Courier New',monospace}

/* MUSCLES */
.muscles{display:flex;flex-wrap:wrap;gap:5px}
.muscle-tag{font-size:8px;padding:3px 8px;border-radius:10px;letter-spacing:.5px;border:1px solid}

/* CUE */
.cue-box{padding:11px 12px;background:#0b1829;border-radius:6px;border-left:3px solid}
.cue-lbl{font-size:8px;letter-spacing:2px;margin-bottom:4px}
.cue-text{font-size:12px;color:#94a3b8;line-height:1.7;font-style:italic}

/* BUTTONS */
.mark-btn{width:100%;padding:14px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:2px;transition:all .2s;border:1px solid}
.mark-btn.done{background:#15803d;border-color:#22c55e;color:#fff}
.nav-row{display:flex;gap:8px}
.nav-btn{flex:1;padding:11px;border-radius:7px;font-size:10px;letter-spacing:1px;transition:all .2s;border:1px solid}
.nav-btn:disabled{opacity:.25;cursor:default}
.safe-pad{height:max(20px,env(safe-area-inset-bottom,20px))}

/* BANNER */
.banner{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,16px));left:16px;right:16px;
  background:#071a0f;border:1px solid #22c55e;border-radius:12px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px #000a;animation:sup .3s ease}
@keyframes sup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script>

  burpee:         [B+'Freehand_Jump_Squat/0.jpg',            B+'Mountain_Climbers/1.jpg'],

const WEEK = [
  {
    day:"MON",fullDay:"Monday",color:"#FF6B35",
    label:"Heavy Lower Body",sublabel:"HIIT Finisher",
    emoji:"🏋️",duration:"~65 min",isRest:false,
    goal:"Build posterior chain mass → raises resting metabolism 24/7",
    exercises:[
      {name:"Hip Circles & Leg Swings",type:"warmup",img:"hipcirc",sets:"—",reps:"2×10 each",rpe:"4",muscles:["Hip Flexors","Glutes","IT Band"],cue:"Standing hip circles: hands on hips, draw full circles 10× each direction. Leg swings: hold wall, swing forward and back 10×. Gradually increase range."},

      {name:"Walking Lunges (Dumbbells)",type:"compound",img:"lunge",sets:"3",reps:"12/leg",rpe:"7",muscles:["Quads","Glutes","Hip Flexors"],cue:"Long stride — front knee stays over ankle, never past toes. Torso upright. Back knee hovers an inch off floor."},

      {name:"⭐ Jump Squat Finisher",type:"finisher",img:"jumpsquat",sets:"6",reps:"40s ON / 20s off",rpe:"10",muscles:["Quads","Glutes","Calves","Cardio"],cue:"ALL-OUT every round — max height every rep. Quarter squat on landing to stay bouncy. This creates the 24-hr afterburn window."},

  {

      {name:"Push-Up Hold Activation",type:"warmup",img:"pushup",sets:"—",reps:"3×10 sec holds",rpe:"3",muscles:["Chest","Shoulders","Core"],cue:"Get into top push-up position, hold 10 sec. Squeeze chest and core tight. Activates chest-to-shoulder connection before loading."},

    exercises:[

      {name:"Scapular Retractions",type:"warmup",img:"facepull",sets:"—",reps:"3×12",rpe:"3",muscles:["Rhomboids","Mid Traps","Rear Delts"],cue:"Stand tall, arms relaxed at sides. WITHOUT bending elbows, pinch shoulder blades together and hold 2 sec. Release fully. Teaches the back muscles to fire before loading them."},
      {name:"Arm Circles",type:"warmup",img:"armcirc",sets:"—",reps:"10×each direction",rpe:"3",muscles:["Rotator Cuff","Deltoids"],cue:"Arms out to sides. 10 small forward → 10 large forward → 10 large backward. Gradually increasing radius each set. Opens shoulder joint fully."},
      {name:"Bent-Over Rows (Dumbbells or Barbell)",type:"compound",img:"bentrow",sets:"4",reps:"10-12 reps",rpe:"8",muscles:["Lats","Rhomboids","Rear Delts","Biceps"],cue:"Hinge to 45° — FLAT back. Drive elbows PAST hips (not up to ceiling). Squeeze shoulder blades for 1 full second at top. 2-3 sec slow descent."},
      {name:"Single-Arm Dumbbell Row",type:"compound",img:"singlerow",sets:"4",reps:"12/side",rpe:"8",muscles:["Lats","Mid Traps","Rhomboids"],cue:"Knee and same-side hand on bench. Let arm HANG fully for complete lat stretch at bottom. Drive elbow straight back toward hip — full contraction at top. Hold 1 sec."},
      {name:"Renegade Rows",type:"compound",img:"renegade",sets:"3",reps:"12/side",rpe:"8",muscles:["Lats","Core","Rhomboids","Triceps"],cue:"High plank with dumbbells, feet shoulder-width. Core braced HARDER than a standard plank. Row one dumbbell to hip — ZERO hip rotation. That's the entire point of the exercise."},
      {name:"Face Pulls",type:"isolation",img:"facepull",sets:"3",reps:"15 reps",rpe:"6",muscles:["Rear Delts","Rotator Cuff","Mid Traps"],cue:"Cable at face height. Pull to face level — elbows flare OUT and UP above shoulder height. External rotate wrists at end (thumbs point behind you). Non-negotiable for shoulder longevity."},

      {name:"Dumbbell Bicep Curls",type:"isolation",img:"curl",sets:"3",reps:"12 reps",rpe:"6",muscles:["Biceps Brachii","Brachialis"],cue:"Elbows PINNED to ribs — they don't move. Supinate (palm rotates up) as you curl. 3-second slow descent. That slow eccentric is where most muscle growth happens."},
      {name:"Hammer Curls",type:"isolation",img:"hammer",sets:"3",reps:"12 reps",rpe:"6",muscles:["Brachialis","Brachioradialis","Biceps"],cue:"Neutral grip — thumbs up like holding a hammer. Alternate arms. The brachialis sits UNDER the bicep — developing it pushes the bicep up, adding peak and overall thickness."},
      {name:"✅ Zone 2 Walk / Jog (Post-Lift)",type:"cardio",img:"walk",sets:"1",reps:"20-25 min",rpe:"4-5",muscles:["Cardio","Fat Oxidation"],cue:"Target 50-60% max HR (about 120-135 bpm at age 27). NASAL BREATHING ONLY — if you need to open your mouth you're going too fast. This is the fat oxidation zone where fat burns directly as fuel."},
      {name:"Lat Overhead Stretch",type:"cooldown",img:"latstr",sets:"—",reps:"30-40 sec/side",rpe:"2",muscles:["Lats","Teres Major"],cue:"Reach overhead and grip a cable column, bar, or doorframe. Lean body AWAY until you feel the side of your back open. Exhale deeper into the stretch each breath."},
      {name:"Bicep Stretch",type:"cooldown",img:"armcirc",sets:"—",reps:"30 sec/side",rpe:"2",muscles:["Biceps","Forearm Flexors"],cue:"Extend arm, palm up. Use other hand to gently pull fingers back toward you. Feel the bicep and forearm stretch. Or press palm flat against a wall and turn body away."},
      {name:"Rear Delt / Cross-Body Stretch",type:"cooldown",img:"armcirc",sets:"—",reps:"30 sec/side",rpe:"2",muscles:["Rear Delts","Rotator Cuff"],cue:"Pull one arm across chest with opposite hand ABOVE the elbow. Keep shoulder DOWN — don't let it shrug up. Hold 30 sec each arm."},
    ]
  },
  {
    day:"FRI",fullDay:"Friday",color:"#F59E0B",
    label:"Full Body Compound",sublabel:"AMRAP Finisher",
    emoji:"⚡",duration:"~65 min",isRest:false,
    goal:"Heaviest compound lifts of the week. Most recomposition stimulus per session.",
    exercises:[
      {name:"Hip Swings Warm-Up",type:"warmup",img:"hipcirc",sets:"—",reps:"2×10 each side",rpe:"4",muscles:["Hip Flexors","Hamstrings","Glutes"],cue:"Hold wall, swing leg forward and back 10× (sagittal). Then side to side 10× (frontal). Gradually increasing range each rep. Critical before deadlifts."},

      {name:"Jump Rope (or Simulated)",type:"warmup",img:"jumpsquat",sets:"—",reps:"2 min",rpe:"5",muscles:["Calves","Cardio","Coordination"],cue:"2 min continuous. Gets HR to 65% max and warms ankles/calves before heavy loading. If no rope, simulate with wrist circles while bouncing on balls of feet."},
      {name:"Deadlifts (Dumbbell or Barbell)",type:"compound",img:"deadlift",sets:"5",reps:"6-8 reps",rpe:"9",muscles:["Hamstrings","Glutes","Back","Traps","Core"],cue:"THE most effective recomp exercise. Stand over bar, push floor away (not 'pull up'). Flat back, chest up. Drive hips THROUGH at lockout. Add weight every single week — this is how you reshape your body."},
      {name:"Dumbbell Thrusters",type:"compound",img:"thruster",sets:"4",reps:"12 reps",rpe:"9",muscles:["Quads","Glutes","Deltoids","Triceps","Core"],cue:"Full depth squat, then drive up explosively and press dumbbells overhead in ONE fluid motion. Entire body fires simultaneously = extreme metabolic demand. Rest 45 sec max."},
      {name:"⭐ Pull-Ups / Lat Pulldowns",type:"compound",img:"pullup",sets:"4",reps:"8-10 reps",rpe:"8",muscles:["Lats","Biceps","Rear Delts","Core"],cue:"Dead hang at bottom — full arm extension. Pull chest to bar, not chin. Elbows drive DOWN and back. If can't do 8, use lat pulldown machine at moderate weight. Add reps every week."},
      {name:"Goblet Squats (Heavy)",type:"compound",img:"goblet",sets:"3",reps:"12 reps",rpe:"8",muscles:["Quads","Glutes","Core"],cue:"Hold heaviest dumbbell available at chest. Elbows inside knees at bottom. Full depth. Stay upright. This is your secondary squat stimulus for the week."},
      {name:"Dumbbell Chest Press (Floor)",type:"compound",img:"floorpress",sets:"3",reps:"12 reps",rpe:"7",muscles:["Chest","Triceps","Front Delts"],cue:"Lie on floor, dumbbells at chest level. Press up explosively, lower 2 sec. Floor limits range slightly — this actually increases tricep activation. Equally effective as bench."},
      {name:"⭐ 15-Min AMRAP Finisher",type:"finisher",img:"burpee",sets:"—",reps:"15 min AMRAP",rpe:"10",muscles:["Full Body","Cardio"],cue:"5 Burpees → 10 Jump Squats → 15 Mountain Climbers. Record how many complete rounds. Beat that number next Friday. This is how conditioning improves."},
      {name:"Hip Flexor Stretch",type:"cooldown",img:"hipflexstr",sets:"—",reps:"30-40 sec/side",rpe:"2",muscles:["Hip Flexors","Quads"],cue:"Kneel on one knee, other foot forward. Push hips FORWARD and slightly down until you feel the front of the back hip. Hold. Critical after heavy deadlifts and squats."},
      {name:"Hamstring Stretch",type:"cooldown",img:"hipflexstr",sets:"—",reps:"30-40 sec/side",rpe:"2",muscles:["Hamstrings","Calves"],cue:"Sit on floor, one leg extended. Reach toward foot, hinge from hips (not rounded back). Hold 30-40 sec. Exhale to go deeper. Never bounce."},
      {name:"Chest & Lat Stretch",type:"cooldown",img:"latstr",sets:"—",reps:"30 sec/side",rpe:"2",muscles:["Chest","Lats","Shoulders"],cue:"For lats: reach overhead on a cable column or doorframe, lean away. For chest: arms at 90° in doorway, lean through. Hold each 30 sec."},
    ]
  },
  {
    day:"SAT",fullDay:"Saturday",color:"#EC4899",
    label:"Metabolic Conditioning",sublabel:"Giant Sets + Sprints",
    emoji:"💥",duration:"~55 min",isRest:false,
    goal:"Maximum fat burn. Giant sets + sprint work targets visceral belly fat through peak EPOC.",
    exercises:[
      {name:"Jump Rope Warm-Up",type:"warmup",img:"jumpsquat",sets:"—",reps:"2 min",rpe:"5",muscles:["Full Body"],cue:"2 min continuous. Get HR to 65% max before the giant set. Skipping this on max intensity day is how injuries happen."},
      {name:"Hip Circles Warm-Up",type:"warmup",img:"hipcirc",sets:"—",reps:"10×each direction",rpe:"4",muscles:["Hips","Hip Flexors"],cue:"Hands on hips, draw circles with hips. 10 clockwise, 10 counterclockwise. Full range of motion. Prepares hip joints for jumping and lunging."},
      {name:"Giant Set — Dumbbell Thrusters",type:"giant",img:"thruster",sets:"4",reps:"15 reps",rpe:"9",muscles:["Quads","Glutes","Deltoids"],cue:"GIANT SET ROUND 1 of 5. Full squat to overhead press. Flow straight to Burpees with only 15 sec rest. 90 sec REST after completing all 5 exercises = 1 round."},
      {name:"Giant Set — Burpees",type:"giant",img:"burpee",sets:"4",reps:"12 reps",rpe:"10",muscles:["Full Body","Cardio"],cue:"ROUND 2 of 5. ALL-OUT. Log your time for 12 reps — beat it next week. 15 sec rest, then Mountain Climbers."},
      {name:"Giant Set — Mountain Climbers",type:"giant",img:"mountainclimb",sets:"4",reps:"30/side",rpe:"9",muscles:["Core","Hip Flexors","Cardio"],cue:"ROUND 3 of 5. Maximum pace. Hips level. 15 sec rest, then Jump Lunges."},
      {name:"Giant Set — Jump Lunges",type:"giant",img:"jumplunge",sets:"4",reps:"10/leg",rpe:"9",muscles:["Quads","Glutes","Calves"],cue:"ROUND 4 of 5. Explosive switch mid-air. Land SOFT — absorb through full leg bend to protect knees. 15 sec rest, then Plank."},
      {name:"Giant Set — Plank Hold",type:"giant",img:"plank",sets:"4",reps:"45 sec",rpe:"7",muscles:["Core","Glutes","Shoulders"],cue:"ROUND 5 of 5 — last exercise before 90 sec rest. Squeeze everything. 4 complete rounds total. This circuit keeps HR in peak fat-burn zone for the entire 16 minutes."},
      {name:"⭐ Sprint Finisher",type:"finisher",img:"sprint",sets:"8",reps:"30s ALL-OUT / 45s walk",rpe:"10",muscles:["Full Body","Cardio"],cue:"8 rounds total = 10 min. Treadmill: 10-12 mph for 30 sec. Target 88-95% max HR. Creates the 24-36 hr fat oxidation afterburn window that makes recomposition work."},
      {name:"Full Body Stretch",type:"cooldown",img:"hipflexstr",sets:"—",reps:"8-10 min",rpe:"2",muscles:["Full Body"],cue:"4-7-8 breathing: inhale 4 sec, hold 7 sec, exhale 8 sec. Repeat 4×. Then hit quads, hip flexors, hamstrings, chest, lats. Extended cool-down after max effort is critical."},
    ]
  },
  {
    day:"SUN",fullDay:"Sunday",color:"#10B981",
    label:"Full Recovery",sublabel:"Meal Prep + Foam Roll",
    emoji:"😴",duration:"~45 min",isRest:true,
    goal:"Recovery IS training. Muscle is built during rest. Treat this day as seriously as any other.",
    exercises:[
      {name:"Recovery Walk",type:"recovery",img:"walk",sets:"1",reps:"25-30 min",rpe:"3",muscles:["Active Recovery","Blood Flow"],cue:"Easy, enjoyable pace. No HR target — just keep the body moving gently. This increases blood flow to sore muscles and speeds repair. Think of it as flushing out the week."},
      {name:"Full Body Foam Rolling",type:"recovery",img:"foamroll",sets:"1",reps:"10 min",rpe:"2",muscles:["Quads","IT Band","Lats","Glutes","Calves"],cue:"Spend 30-45 sec on each tight spot. Roll SLOWLY — when you find a tender spot, pause and breathe into it. Don't roll over joints. Order: calves → IT band → quads → glutes → lats."},
      {name:"Static Stretching — Full Body",type:"recovery",img:"hipflexstr",sets:"1",reps:"15 min",rpe:"2",muscles:["Full Body"],cue:"Hold every stretch 30-60 sec. Focus on what's sore from Saturday. Breathe out to go deeper. Never bounce. This is when flexibility actually improves — when the muscle is fully warm and you're relaxed."},
      {name:"Meal Prep",type:"admin",img:"walk",sets:"—",reps:"Priority",rpe:"—",muscles:["Nutrition"],cue:"Prep 4-5 days of meals. Target 165g protein daily: chicken breast, ground beef, eggs, cottage cheese, Greek yogurt. This single habit drives 80% of your recomp results. Without it, the workouts are half as effective."},
      {name:"Hydration Check",type:"admin",img:"walk",sets:"—",reps:"3-4 liters",rpe:"—",muscles:["Recovery"],cue:"3-4 liters spread throughout the day. Add electrolytes (sodium, potassium, magnesium) on training days. Dehydration reduces fat oxidation by 30% and makes every workout harder."},
      {name:"Sleep Optimization",type:"admin",img:"walk",sets:"—",reps:"7-9 hours",rpe:"—",muscles:["Recovery","Hormones"],cue:"Growth hormone peaks during Stage 3-4 sleep — this is when fat is burned and muscle is built. Dark room, cool temperature (65-68°F). Consistent bedtime matters more than duration."},
      {name:"Review & Log the Week",type:"admin",img:"walk",sets:"—",reps:"10 min",rpe:"—",muscles:["Progressive Overload"],cue:"Write down every weight you lifted this week. Plan to add 2.5-5 lbs to deadlifts and squats next week. Add 1 rep to rows and presses. Progressive overload is the ONLY mechanism for recomposition — this 10 minutes is what makes it happen."},
    ]
  }
];

const TYPE_COLORS={warmup:"#4FC3F7",compound:"#FF6B35",isolation:"#A855F7",hiit:"#EF4444",
  finisher:"#F59E0B",core:"#EC4899",cardio:"#10B981",giant:"#EC4899",
  recovery:"#10B981",cooldown:"#78909C",admin:"#78909C"};

// ─── STATE ────────────────────────────────────────────────────────────────────
let S={
  dayIdx:(()=>{const d=new Date().getDay();return d===0?6:d-1;})(),
  selEx:null, view:'list',
  completed:JSON.parse(localStorage.getItem('rc_done')||'{}'),
  frame:{} // tracks which frame (0 or 1) is showing per exercise
};
function save(){localStorage.setItem('rc_done',JSON.stringify(S.completed));}
function key(di,ei){return `${di}-${ei}`;}
function dayDone(di){return WEEK[di].exercises.filter((_,ei)=>S.completed[key(di,ei)]).length;}
function totalDone(){return WEEK.reduce((a,_,di)=>a+dayDone(di),0);}
function totalEx(){return WEEK.reduce((a,d)=>a+d.exercises.length,0);}

// Flip-book timer — flips all loaded demo images
let flipTimer=null;
function startFlip(){
  if(flipTimer)clearInterval(flipTimer);
  flipTimer=setInterval(()=>{
    document.querySelectorAll('.demo-wrap').forEach(wrap=>{
      const f0=wrap.querySelector('.f0'),f1=wrap.querySelector('.f1');
      if(!f0||!f1)return;
      const showing0=!f0.classList.contains('hide');
      if(showing0){f0.classList.add('hide');f1.classList.remove('hide');}
      else{f1.classList.add('hide');f0.classList.remove('hide');}
    });
  },1200);
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById('root');
  const today=WEEK[S.dayIdx];
  const c=today.color;
  const pct=Math.round((totalDone()/totalEx())*100);
  const dDone=dayDone(S.dayIdx);
  const isDetail=S.view==='detail'&&S.selEx!==null;

  let detailHtml='';
  if(isDetail){
    const ex=today.exercises[S.selEx];
    const k=key(S.dayIdx,S.selEx);
    const isDone=!!S.completed[k];
    const tc=TYPE_COLORS[ex.type]||c;
    const imgs=IMG[ex.img]||IMG.walk;
    const statsHtml=[['SETS',ex.sets],['REPS',ex.reps],['RPE',ex.rpe]]
      .filter(([,v])=>v!=='—')
      .map(([l,v])=>`<div class="stat-box" style="border-color:${tc}35"><div class="stat-lbl">${l}</div><div class="stat-val" style="color:${tc}">${v}</div></div>`)
      .join('');
    const muscleHtml=ex.muscles.map(m=>`<span class="muscle-tag" style="background:${tc}18;color:${tc};border-color:${tc}30">${m}</span>`).join('');

    detailHtml=`<div class="detail">
      <div class="detail-inner">
        <button class="back-btn" onclick="goBack()">← BACK</button>
        <div>
          <div class="det-type" style="color:${tc}">${ex.type.toUpperCase()}</div>
          <div class="det-name">${ex.name}</div>
        </div>
        <div class="stats-row">${statsHtml}</div>

        <!-- FLIP-BOOK DEMO: real exercise photos, CSS cross-fade -->
        <div class="demo-wrap" style="border-color:${tc}30">
          <img class="demo-spacer" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt=""/>
          <img class="demo-frame f0 show" src="${imgs[0]}" alt="${ex.name} start" loading="lazy"
            onerror="this.style.display='none'"/>
          <img class="demo-frame f1 hide" src="${imgs[1]}" alt="${ex.name} end" loading="lazy"
            onerror="this.style.display='none'"/>
          <div class="demo-badge" style="background:${tc}dd">● LIVE DEMO</div>
          <div class="demo-src">free-exercise-db</div>
        </div>

        <div class="muscles">${muscleHtml}</div>

        <div class="cue-box" style="border-color:${tc}">
          <div class="cue-lbl" style="color:${tc}">⚡ COACHING CUE</div>
          <p class="cue-text">"${ex.cue}"</p>
        </div>

        <button class="mark-btn${isDone?' done':''}"
          style="${isDone?'':'background:'+tc+'20;border-color:'+tc+';color:'+tc}"
          onclick="toggleDone(${S.dayIdx},${S.selEx})">
          ${isDone?'✓  COMPLETED':'MARK COMPLETE'}
        </button>

        <div class="nav-row">
          <button class="nav-btn" style="background:transparent;border-color:#1e3040;color:#374151"
            onclick="navEx(-1)" ${S.selEx===0?'disabled':''}>← PREV</button>
          <button class="nav-btn"
            style="background:${S.selEx===today.exercises.length-1?'transparent':c};border-color:${c};color:${S.selEx===today.exercises.length-1?c:'#fff'}"
            onclick="navEx(1)" ${S.selEx===today.exercises.length-1?'disabled':''}>NEXT →</button>
        </div>
        <div class="safe-pad"></div>
      </div>
    </div>`;
  }

  const listItems=today.exercises.map((ex,ei)=>{
    const k=key(S.dayIdx,ei);
    const isDone=!!S.completed[k];
    const tc=TYPE_COLORS[ex.type]||c;
    const isSel=S.selEx===ei&&isDetail;
    return `<div class="ex-row${isSel?' sel':''}" style="--c:${c};${isSel?'background:'+c+'10':''}" onclick="selectEx(${ei})">
      <div class="ex-dot${isDone?' ready':''}"></div>
      <div style="flex:1;min-width:0">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">
          <span class="ex-type-lbl" style="color:${tc}">${ex.type.toUpperCase()}</span>
          ${ex.sets!=='—'?`<span class="ex-sets">${ex.sets}×${ex.reps}</span>`:''}
        </div>
      </div>
      <button class="done-btn${isDone?' chk':''}" onclick="event.stopPropagation();toggleDone(${S.dayIdx},${ei})">
        ${isDone?'✓':'○'}
      </button>
    </div>`;
  }).join('');

  const bannerHtml=dDone===today.exercises.length?`
    <div class="banner">
      <span style="font-size:28px">🏆</span>
      <div>
        <div style="font-size:12px;color:#22c55e;font-weight:700;letter-spacing:1px">${today.fullDay.toUpperCase()} COMPLETE</div>
        <div style="font-size:9px;color:#374151;margin-top:2px">${S.dayIdx<6?'Next: '+WEEK[S.dayIdx+1].fullDay+' — '+WEEK[S.dayIdx+1].label:'Full week done! 🎉'}</div>
      </div>
    </div>`:'';

  root.innerHTML=`
    <div class="hdr">
      <div class="hdr-top">
        <div><div class="hdr-subtitle">20% → 11% BF · RECOMP PLAN</div><div class="hdr-title">7-DAY ROUTINE</div></div>
        <div><div class="hdr-pct" style="color:${c}">${pct}%</div><div class="hdr-pct-label">WEEKLY</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${c},#10b981)"></div></div>
      <div class="day-tabs" id="dayTabs">
        ${WEEK.map((day,di)=>{
          const dd=dayDone(di),tot=day.exercises.length;
          const filled=Math.round((dd/tot)*5);
          const dots=Array.from({length:Math.min(tot,5)},(_,i)=>`<div class="dot${i<filled?' on':''}"></div>`).join('');
          return `<button class="day-tab${di===S.dayIdx?' active':''}" style="--c:${day.color}" onclick="selectDay(${di})">
            <span class="em">${day.emoji}</span>
            <span class="lb">${day.day}</span>
            <div class="dots">${dots}</div>
          </button>`;
        }).join('')}
      </div>
    </div>

    <div class="day-hdr" style="background:linear-gradient(135deg,${c}10 0%,transparent 100%)">
      <div class="day-hdr-row">
        <div style="flex:1">
          <div class="day-type" style="color:${c}">${today.isRest?'REST & RECOVERY':'TRAINING DAY'} · ${today.duration}</div>
          <div class="day-name">${today.emoji} ${today.label}</div>
          <div class="day-sub">${today.sublabel}</div>
        </div>
        <div class="day-ctr" style="background:${c}20;border:1px solid ${c}40;color:${c}">${dDone}/${today.exercises.length}</div>
      </div>
      <div class="day-goal" style="border-color:${c}40">${today.goal}</div>
    </div>

    <div class="body">
      <div class="ex-list ${isDetail?'split':'full'}">
        ${listItems}
        <div style="height:max(16px,env(safe-area-inset-bottom,16px))"></div>
      </div>
      ${detailHtml}
    </div>
    ${bannerHtml}`;

  const tabs=document.getElementById('dayTabs');
  if(tabs){const a=tabs.children[S.dayIdx];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}

  // Start flip-book animation after render
  if(isDetail) startFlip();
  else if(flipTimer){clearInterval(flipTimer);flipTimer=null;}
}

function selectDay(di){S.dayIdx=di;S.selEx=null;S.view='list';render();}
function selectEx(ei){
  if(S.selEx===ei&&S.view==='detail'){S.selEx=null;S.view='list';}
  else{S.selEx=ei;S.view='detail';}
  render();
}
function goBack(){S.view='list';render();}
function navEx(dir){
  const n=S.selEx+dir;
  if(n>=0&&n<WEEK[S.dayIdx].exercises.length){S.selEx=n;render();}
}
function toggleDone(di,ei){
  const k=key(di,ei);S.completed[k]=!S.completed[k];
  save();render();
}

render();
</script>
</body>
</html>
